aid: contextsdk
name: ContextSDK
description: >-
  ContextSDK is an on-device context intelligence layer for mobile apps, founded by
  Felix Krause and Dieter Rappold and backed by Speedinvest. Its SDK processes 300+
  real-world device signals (accelerometer, gyroscope, motion, screen state, ambient
  signals) through on-device machine learning to determine what a user is doing in the
  moment — commuting, relaxing, working, or being active — within seconds of app launch,
  with no PII collected and a ~0.6 MB footprint. Two products build on this: ContextDecision
  for intelligent timing of in-app actions and messages, and ContextPush for context-aware
  push notification delivery. ContextSDK ships native clients for iOS (Swift), Flutter, React
  Native, and Unity, with Android in beta, and is SOC 2 Type 2 certified and GDPR compliant.
